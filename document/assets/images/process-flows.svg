<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" style="background:#ffffff; font-family:'Liberation Sans', 'Noto Sans', sans-serif;">
  <defs>
    <filter id="shadow-flow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Diagrama de Secuencia y Flujos de Procesos</text>
  <text x="460" y="48" text-anchor="middle" font-size="11.5" fill="#64748b">Telemetría reactiva periódica y bucle cerrado de telemando con conciliación de estado</text>

  <!-- Actors Header -->
  <!-- Actor 1: Dispositivo -->
  <g transform="translate(60, 70)">
    <rect width="140" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-flow)"/>
    <text x="70" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Dispositivo</text>
    <text x="70" y="34" text-anchor="middle" font-size="9" fill="#2563eb">(STM32 / Simulador)</text>
    <line x1="70" y1="42" x2="70" y2="390" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Actor 2: NLECloud -->
  <g transform="translate(290, 70)">
    <rect width="140" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow-flow)"/>
    <text x="70" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">NLECloud Broker</text>
    <text x="70" y="34" text-anchor="middle" font-size="9" fill="#d97706">(TCP Gateway &amp; REST)</text>
    <line x1="70" y1="42" x2="70" y2="390" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Actor 3: Rust Backend -->
  <g transform="translate(520, 70)">
    <rect width="140" height="42" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow-flow)"/>
    <text x="70" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">Backend en Rust</text>
    <text x="70" y="34" text-anchor="middle" font-size="9" fill="#ea580c">(Relay en Memoria)</text>
    <line x1="70" y1="42" x2="70" y2="390" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Actor 4: Frontend Web -->
  <g transform="translate(740, 70)">
    <rect width="140" height="42" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#shadow-flow)"/>
    <text x="70" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">Frontend Web</text>
    <text x="70" y="34" text-anchor="middle" font-size="9" fill="#059669">(Vue 3 Dashboard)</text>
    <line x1="70" y1="42" x2="70" y2="390" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- STEP 1: Handshake (140) -->
  <g transform="translate(0, 135)">
    <line x1="130" y1="0" x2="352" y2="0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="240" y="-6" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">1. TCP Handshake t:1 (CONN_REQ)</text>
    <line x1="360" y1="16" x2="138" y2="16" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>
    <text x="250" y="28" text-anchor="middle" font-size="8.5" fill="#1d4ed8">t:2 (CONN_RESP status:0)</text>
  </g>

  <!-- STEP 2: Telemetry Push (190) -->
  <g transform="translate(0, 195)">
    <line x1="130" y1="0" x2="352" y2="0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text x="240" y="-6" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">2. Telemetría t:3 (PUSH_DATA: brightness)</text>
    <line x1="360" y1="14" x2="138" y2="14" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>
    <text x="250" y="25" text-anchor="middle" font-size="8" fill="#1d4ed8">t:4 (PUSH_ACK)</text>
  </g>

  <!-- STEP 3: Backend Polling & SSE Push (245) -->
  <g transform="translate(0, 245)">
    <line x1="590" y1="0" x2="368" y2="0" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <text x="480" y="-6" text-anchor="middle" font-size="9" fill="#c2410c" font-weight="bold">3. Sondeo Asíncrono SDK (get_project_sensors_realtime)</text>
    <line x1="360" y1="14" x2="582" y2="14" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-amber)"/>
    <text x="475" y="25" text-anchor="middle" font-size="8.5" fill="#c2410c">Respuesta REST (Tags y Estados)</text>

    <!-- SSE to Frontend -->
    <line x1="590" y1="40" x2="802" y2="40" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="700" y="34" text-anchor="middle" font-size="9" fill="#047857" font-weight="bold">4. Server-Sent Events (SSE update)</text>
    <rect x="760" y="46" width="100" height="18" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8"/>
    <text x="810" y="58" text-anchor="middle" font-size="8" fill="#047857">Actualiza Chart.js en UI</text>
  </g>

  <!-- STEP 4: Telemando Loop (340) -->
  <g transform="translate(0, 345)">
    <!-- Frontend to Backend -->
    <line x1="810" y1="0" x2="598" y2="0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
    <text x="705" y="-6" text-anchor="middle" font-size="9" fill="#6d28d9" font-weight="bold">5. POST /api/devices/control (lamp=1)</text>

    <!-- Backend sends command to NLE -->
    <line x1="590" y1="20" x2="368" y2="20" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arr-amber)"/>
    <text x="480" y="14" text-anchor="middle" font-size="9" fill="#c2410c" font-weight="bold">6. SDK send_cmd() (Settling TTL activo)</text>

    <!-- NLE sends TCP CMD_REQ to Device -->
    <line x1="360" y1="40" x2="138" y2="40" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
    <text x="250" y="34" text-anchor="middle" font-size="9" fill="#b45309" font-weight="bold">7. Socket TCP t:5 (CMD_REQ)</text>

    <!-- Device executes and responds -->
    <line x1="130" y1="60" x2="352" y2="60" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="240" y="54" text-anchor="middle" font-size="8.5" fill="#1d4ed8" font-weight="bold">8. Ejecuta GPIO / PWM y responde t:6 (CMD_RESP)</text>
  </g>
</svg>