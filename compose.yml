services:
  caddy:
    image: caddy:2.9-alpine
    container_name: app-caddy
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-net
    depends_on:
      - server
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: localhost/votos-sa-frontend:latest
    container_name: app-frontend
    restart: unless-stopped
    networks:
      - app-net

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: localhost/votos-sa-server:latest
    container_name: app-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
