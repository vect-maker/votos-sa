services:
  caddy:
    image: caddy:2.9-alpine
    container_name: app-caddy
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-net
    depends_on:
      - server
      - frontend

  frontend:
    image: node:26-alpine
    container_name: app-frontend
    working_dir: /app
    command: sh -c "test -d node_modules/vite || npm install; npm run dev"
    volumes:
      - ./frontend:/app:z
      # Anonymous volume prevents host and container node_modules collision
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_EVENTS_URL=/api/events
    networks:
      - app-net
    restart: unless-stopped

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
